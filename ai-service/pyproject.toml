[project]
name = "humantwin-ai-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3", "openai>=2,<3", "httpx>=0.28,<1", "beautifulsoup4>=4.13,<5", "numpy>=2,<3", "opencv-python-headless>=4.12,<5"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2"]
dental-training = ["ultralytics==8.3.235", "ultralytics-thop==2.0.18", "torch==2.7.1", "torchvision==0.22.1", "onnx==1.19.1", "onnxruntime==1.23.2", "numpy>=2,<2.3", "opencv-python>=4.12,<5", "polars>=1,<2"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128", marker = "sys_platform == 'win32'" }
torchvision = { index = "pytorch-cu128", marker = "sys_platform == 'win32'" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
